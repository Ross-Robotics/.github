name: Bug report
description: Report a defect in the software or firmware.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug, including what happened and what was expected to happen. Screenshots and videos can be attached here.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: The steps required to reproduce the bug. If it cannot be reproduced, state "Not reproducible".
      placeholder: |
        1. Robot on base station '...'
        2. Start inspection '...'
        3. Observe the error

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Safety issue
        - Robot stops working or requires manual intervention
        - Functionality incorrect or degraded
        - Minor or cosmetic issue
        - Potential issue (identified but not yet observed)
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Software Version
      description: The version of each relevant component, as a release tag, branch or commit hash.
      placeholder: |
        ccu: v1.4.2
        ocu: v1.4.2
    validations:
      required: true

  - type: dropdown
    id: robot-model
    attributes:
      label: Robot Model
      multiple: true
      options:
        - "4.1"
        - "4.1.1"
        - "4.1.2"
        - "4.2"
        - Not applicable

  - type: textarea
    id: logs
    attributes:
      label: Robot Logs
      description: Paste any relevant log output, e.g. from `docker logs <container_name> -t --tail <N>`.
      render: shell
